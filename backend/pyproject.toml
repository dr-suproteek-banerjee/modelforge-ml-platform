[project]
name = "modelforge"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.15,<2",
  "celery[redis]>=5.5,<6",
  "fastapi>=0.115,<1",
  "mlflow-skinny>=3.1,<4",
  "numpy>=2.2,<3",
  "optuna>=4.3,<5",
  "pandas>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.22,<1",
  "scikit-learn>=1.8,<1.9",
  "scipy>=1.15,<2",
  "skops>=0.13,<1",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn>=0.34,<1",
  "xgboost-cpu>=3.0,<4; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "xgboost>=3.0,<4; sys_platform != 'linux' or platform_machine != 'x86_64'",
]

[project.optional-dependencies]
torch = ["torch==2.9.1"]

[tool.uv.sources]
torch = [{index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'"}]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["httpx>=0.28,<1", "mypy>=1.15,<3", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["."]
