x-backend: &backend
  image: modelforge-backend:local
  build:
    context: ./backend
    args:
      ENABLE_TORCH: ${MODELFORGE_ENABLE_TORCH:-0}
  environment:
    MF_DATABASE_URL: postgresql+psycopg://modelforge:${POSTGRES_PASSWORD:-local-dev-only}@db/modelforge
    MF_REDIS_URL: redis://redis:6379/0
    MF_ARTIFACT_ROOT: /artifacts
    MF_TRACKING_URI: sqlite:////artifacts/mlflow.db
    OPENBLAS_NUM_THREADS: "1"
    OMP_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
  volumes:
    - artifacts:/artifacts

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: modelforge
      POSTGRES_DB: modelforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "modelforge", "-d", "modelforge"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - broker:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${MODELFORGE_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20

  worker:
    <<: *backend
    command: ["celery", "-A", "modelforge.jobs:celery_app", "worker", "--concurrency=1", "--loglevel=INFO"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${MODELFORGE_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  database:
  broker:
  artifacts:
